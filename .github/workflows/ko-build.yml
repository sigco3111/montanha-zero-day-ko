name: ko-build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build KO tree from upstream code + patches
        id: build
        continue-on-error: true
        run: python3 tools/ko_build.py

      - name: Commit result (also on failure, so the report lands)
        run: |
          git config user.name "ko-build"
          git config user.email "ko-build@users.noreply.github.com"
          git add -A
          git commit -m "build: upstream code + Korean patches" || echo "no changes"
          git push

      - name: Fail job if patches missed
        if: steps.build.outcome == 'failure'
        run: exit 1
